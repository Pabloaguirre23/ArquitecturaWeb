server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: orders-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/orders_db}
    username: ${DB_USER:ticketya}
    password: ${DB_PASSWORD:ticketya}
    hikari:
      # La saga mantiene la conexión durante los pasos HTTP; con el pool por
      # defecto (10) la prueba de carga de 500/1000 usuarios agota la cola.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:ticketya}
    password: ${RABBITMQ_PASSWORD:ticketya}
    connection-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

inventory:
  url: ${INVENTORY_URL:http://localhost:8082}

catalog:
  url: ${CATALOG_URL:http://localhost:8081}

orders:
  outbox:
    exchange: ${ORDERS_OUTBOX_EXCHANGE:ticketya.events}
    publish-ms: ${ORDERS_OUTBOX_PUBLISH_MS:2000}
    batch-size: ${ORDERS_OUTBOX_BATCH_SIZE:50}
    max-attempts: ${ORDERS_OUTBOX_MAX_ATTEMPTS:10}
    base-backoff-seconds: ${ORDERS_OUTBOX_BACKOFF_SECONDS:5}
    max-backoff-seconds: ${ORDERS_OUTBOX_MAX_BACKOFF_SECONDS:300}
