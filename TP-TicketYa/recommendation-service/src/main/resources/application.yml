server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: recommendation-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/recommendation_db}
      auto-index-creation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

recommendation:
  internal-token: ${INTERNAL_TOKEN:ticketya-internal-dev}
  mongo:
    ensure-indexes: ${RECOMMENDATION_ENSURE_INDEXES:true}
  seed:
    enabled: ${RECOMMENDATION_SEED_ENABLED:true}
