server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: recommendation-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/recommendation_db}
      auto-index-creation: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
