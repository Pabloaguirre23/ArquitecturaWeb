server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: catalog-service
          uri: ${CATALOG_URL:http://localhost:8081}
          predicates:
            - Path=/api/catalog/**
        - id: inventory-service
          uri: ${INVENTORY_URL:http://localhost:8082}
          predicates:
            - Path=/api/inventory/**
        - id: orders-service
          uri: ${ORDERS_URL:http://localhost:8083}
          predicates:
            - Path=/api/orders/**
        - id: recommendation-service
          uri: ${RECOMMENDATION_URL:http://localhost:8084}
          predicates:
            - Path=/api/recommendations/**
        - id: notification-service
          uri: ${NOTIFICATION_URL:http://localhost:8085}
          predicates:
            - Path=/api/notifications/**
        - id: queue-service
          uri: ${QUEUE_URL:http://localhost:8086}
          predicates:
            - Path=/api/queue/**
      httpclient:
        connect-timeout: 2000
        response-timeout: 10s
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "*"
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

ticketya:
  security:
    jwt:
      secret: ${JWT_SECRET:ticketya-dev-secret-change-me-32-bytes-min!!}
      ttl: ${JWT_TTL:8h}