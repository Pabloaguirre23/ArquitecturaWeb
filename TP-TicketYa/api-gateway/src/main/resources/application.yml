server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: catalog-service
          uri: ${CATALOG_URL:http://localhost:8081}
          predicates:
            - Path=/api/catalog/**
        - id: inventory-service
          uri: ${INVENTORY_URL:http://localhost:8082}
          predicates:
            - Path=/api/inventory/**
        - id: orders-service
          uri: ${ORDERS_URL:http://localhost:8083}
          predicates:
            - Path=/api/orders/**
        - id: recommendation-service
          uri: ${RECOMMENDATION_URL:http://localhost:8084}
          predicates:
            - Path=/api/recommendations/**
        - id: notification-service
          uri: ${NOTIFICATION_URL:http://localhost:8085}
          predicates:
            - Path=/api/notifications/**
        - id: queue-service
          uri: ${QUEUE_URL:http://localhost:8086}
          predicates:
            - Path=/api/queue/**
      httpclient:
        connect-timeout: 2000
        response-timeout: 10s
      globalcors:
        cors-configurations:
          '[/**]':
            # La web se sirve same-origin (nginx proxya /api al gateway), así que el CORS
            # queda limitado a los orígenes explícitos del entorno; nunca "*".
            allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers:
              - Authorization
              - Content-Type
              - Idempotency-Key
              - X-Correlation-Id
              - X-Queue-Token
            exposed-headers:
              - X-Correlation-Id

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

ticketya:
  security:
    jwt:
      # Sin default: si falta JWT_SECRET el gateway no arranca (fail-fast).
      secret: ${JWT_SECRET}
      ttl: ${JWT_TTL:8h}