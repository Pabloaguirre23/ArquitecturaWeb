server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: catalog-service
          uri: ${CATALOG_URL:http://localhost:8081}
          predicates:
            - Path=/api/catalog/**
        - id: inventory-service
          uri: ${INVENTORY_URL:http://localhost:8082}
          predicates:
            - Path=/api/inventory/**
        - id: orders-service
          uri: ${ORDERS_URL:http://localhost:8083}
          predicates:
            - Path=/api/orders/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
