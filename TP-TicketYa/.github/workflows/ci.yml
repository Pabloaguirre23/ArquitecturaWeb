name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - catalog-service
          - inventory-service
          - orders-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build y tests
        working-directory: ${{ matrix.service }}
        run: mvn -B -ntp verify

  compose:
    name: validar docker-compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar configuración
        run: docker compose -f docker-compose.dev.yml config

  openapi:
    name: validar OpenAPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar archivos OpenAPI
        run: |
          for f in openapi/*.json; do
            echo "Validando $f"
            jq -e 'has("openapi") and has("paths")' "$f" > /dev/null
          done