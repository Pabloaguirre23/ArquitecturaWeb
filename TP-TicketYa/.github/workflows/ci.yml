name: CI

# Copia del workflow para cuando TP-TicketYa se entrega como repositorio propio.
# En el repositorio del curso el workflow activo es el del directorio raíz.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  services:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - catalog-service
          - inventory-service
          - orders-service
          - queue-service
          - recommendation-service
          - notification-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build y tests
        working-directory: ${{ matrix.service }}
        run: mvn -B -ntp verify

  web:
    name: build (web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build, lint y tests
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run lint
          npm run test

  compose:
    name: validar compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar configuración
        run: |
          docker compose -f docker-compose.dev.yml config
          docker compose -f docker-compose.yml config

  openapi:
    name: validar OpenAPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar archivos OpenAPI
        run: |
          shopt -s nullglob
          archivos=(openapi/*.json)
          if [ ${#archivos[@]} -eq 0 ]; then
            echo "No hay archivos OpenAPI en esta rama; se omite."
            exit 0
          fi
          for f in "${archivos[@]}"; do
            echo "Validando $f"
            jq -e 'has("openapi") and has("paths")' "$f" > /dev/null
          done
