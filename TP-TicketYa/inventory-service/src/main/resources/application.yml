server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: inventory-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/inventory_db}
    username: ${DB_USER:ticketya}
    password: ${DB_PASSWORD:ticketya}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000
      leak-detection-threshold: 10000
      data-source-properties:
        options: "-c lock_timeout=3000"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

catalog:
  url: ${CATALOG_URL:http://localhost:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
