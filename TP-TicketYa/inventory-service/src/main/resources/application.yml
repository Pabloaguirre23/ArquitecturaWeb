server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: inventory-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/inventory_db}
    username: ${DB_USER:ticketya}
    password: ${DB_PASSWORD:ticketya}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      leak-detection-threshold: 10000
      data-source-properties:
        options: "-c lock_timeout=3000"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

catalog:
  url: ${CATALOG_URL:http://localhost:8081}
  timeout:
    connect-ms: ${CATALOG_CONNECT_TIMEOUT_MS:2000}
    read-ms: ${CATALOG_READ_TIMEOUT_MS:2000}

resilience4j:
  circuitbreaker:
    circuitBreakerAspectOrder: 1
    instances:
      catalog:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 1
        automaticTransitionFromOpenToHalfOpenEnabled: true
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException
      queue:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 1
        automaticTransitionFromOpenToHalfOpenEnabled: true
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException
  retry:
    retryAspectOrder: 2
    instances:
      catalog:
        maxAttempts: 3
        waitDuration: 100ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        randomizedWaitFactor: 0.5
        retryExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
      queue:
        maxAttempts: 3
        waitDuration: 100ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        randomizedWaitFactor: 0.5
        retryExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException

inventory:
  internal-token: ${INTERNAL_TOKEN:ticketya-internal-dev}

queue:
  url: ${QUEUE_URL:http://localhost:8086}
  internal-token: ${INTERNAL_TOKEN:ticketya-internal-dev}
  timeout:
    connect-ms: ${QUEUE_CONNECT_TIMEOUT_MS:2000}
    read-ms: ${QUEUE_READ_TIMEOUT_MS:2000}
  token:
    secret: ${QUEUE_TOKEN_SECRET:ticketya-queue-dev-secret-key-32b}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
