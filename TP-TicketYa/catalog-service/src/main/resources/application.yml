server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: catalog-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/catalog_db}
    username: ${DB_USER:ticketya}
    password: ${DB_PASSWORD:ticketya}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

inventory:
  url: ${INVENTORY_URL:http://localhost:8082}
  timeout:
    connect-ms: ${INVENTORY_CONNECT_TIMEOUT_MS:2000}
    read-ms: ${INVENTORY_READ_TIMEOUT_MS:3000}

orders:
  url: ${ORDERS_URL:http://localhost:8083}
  timeout:
    connect-ms: ${ORDERS_CONNECT_TIMEOUT_MS:1000}
    read-ms: ${ORDERS_READ_TIMEOUT_MS:2000}

catalog:
  scheduler:
    finalizacion-ms: ${CATALOG_SCHEDULER_FINALIZACION_MS:60000}
