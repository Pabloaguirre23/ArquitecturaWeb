# Perfil por defecto: H2 en memoria, sin necesidad de instalar nada.
# Para usar MySQL: -Dspring-boot.run.profiles=mysql

spring.datasource.url=jdbc:h2:mem:tp3;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Consola web de H2 (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# Manejo correcto de LocalDate/null en la serializacion
spring.jackson.serialization.write-dates-as-timestamps=false